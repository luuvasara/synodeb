# synodeb VM test: answers for an unattended run of the installer (over network-console).
# Two virtual SATA disks, root on a RAID1 array, user "test".
d-i passwd/root-login boolean false
d-i passwd/user-fullname string synodeb test
d-i passwd/username string test
d-i passwd/user-password password synodeb-test
d-i passwd/user-password-again password synodeb-test
d-i user-setup/allow-password-weak boolean true
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Rome
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/sda /dev/sdb
d-i partman-auto/method string raid
d-i partman-auto/expert_recipe string multiraid :: 1000 5000 -1 raid $primary{ } method{ raid } .
d-i partman-auto/choose_recipe select multiraid
d-i partman-auto-raid/recipe string 1 2 0 ext4 / /dev/sda1#/dev/sdb1 .
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman/early_command string true

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true
